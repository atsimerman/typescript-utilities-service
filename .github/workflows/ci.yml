name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    # next build eagerly evaluates lib/auth.ts (getDB()) while collecting page
    # data for /api/auth/[...all], which just needs DATABASE_URL to be set —
    # no connection is made at build time, so a dummy value is enough.
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build:web

      - name: Check types
        run: pnpm check-types

      - name: Lint
        run: pnpm lint:ci

      - name: Test
        run: pnpm test
